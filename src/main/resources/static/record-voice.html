<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoVault — Record Voice Memory</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; padding: 2rem 1rem; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #1e293b; padding-bottom: 1rem; }
        .brand { color: #0ea5e9; font-weight: 700; text-decoration: none; font-size: 1.1rem; }
        .brand:hover { text-decoration: underline; }

        .card { background: #131c31; border: 1px solid #1e293b; border-radius: 12px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        .card h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.35rem; color: #f8fafc; }
        .subtitle { color: #94a3b8; font-size: 0.875rem; margin-bottom: 1.75rem; line-height: 1.4; }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.5rem; font-weight: 500; }
        input[type="text"], select { width: 100%; padding: 0.85rem; background: #0b1120; border: 1px solid #1e293b; border-radius: 6px; color: #fff; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus, select:focus { border-color: #0ea5e9; }

        .recorder-controls { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 2rem 0; gap: 1rem; }
        .btn-record { background: #ef4444; color: white; border: none; padding: 1rem 2rem; border-radius: 50px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .btn-record:hover { background: #dc2626; transform: scale(1.02); }
        .btn-record.recording { background: #22c55e; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .status-msg { padding: 0.85rem; border-radius: 6px; font-size: 0.875rem; display: none; text-align: center; font-weight: 500; margin-top: 1rem; }
        .status-success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
        .status-error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid #ef4444; }
        
        audio { width: 100%; margin-top: 1rem; border-radius: 6px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/dashboard.html" class="brand">← Dashboard</a>
            <span style="color: #64748b; font-size: 0.9rem;">Audio Memory</span>
        </div>

        <div class="card">
            <h1>Record Voice Memory</h1>
            <p class="subtitle">Your recording will be securely uploaded and transcribed automatically.</p>

            <form id="voiceForm">
                <div class="form-group">
                    <label for="title">Title / Identifier</label>
                    <input type="text" id="title" required placeholder="e.g. Motivation">
                </div>

                <div class="form-group">
                    <label for="tag">Context Tag</label>
                    <select id="tag">
                        <option value="MOTIVATIONAL" selected>Motivational</option>
                        <option value="PERSONAL">Personal</option>
                        <option value="FAMILY">Family</option>
                        <option value="ADVICE">Advice</option>
                        <option value="STORY">Story</option>
                    </select>
                </div>

                <div class="recorder-controls">
                    <button type="button" id="recordBtn" class="btn-record">
                        <span id="recordIcon">🔴</span> <span id="recordText">Start Recording</span>
                    </button>
                    <audio id="audioPreview" controls></audio>
                </div>

                <div id="statusAlert" class="status-msg"></div>
            </form>
        </div>
    </div>

    <script src="/js/auth-check.js"></script>
    <script>
        const token = localStorage.getItem('jwtToken');
        if (!token) window.location.href = '/login.html';

        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;
        let isRecording = false;

        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const audioPreview = document.getElementById('audioPreview');
        const statusAlert = document.getElementById('statusAlert');

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                // Start Recording
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        audioPreview.src = audioUrl;
                        audioPreview.style.display = 'block';
                        await autoUploadVoiceNote();
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    recordText.textContent = 'Stop Recording';
                } catch (err) {
                    showStatus('Microphone permission denied or unavailable.', 'error');
                }
            } else {
                // Stop Recording
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordText.textContent = 'Record Again';
            }
        });

        async function autoUploadVoiceNote() {
            const title = document.getElementById('title').value.trim();
            const tag = document.getElementById('tag').value;

            if (!title) {
                showStatus('Please enter a Title / Identifier before uploading.', 'error');
                return;
            }

            showStatus('Uploading & Transcribing...', 'success');

            const formData = new FormData();
            formData.append('title', title);
            formData.append('tag', tag);
            formData.append('file', audioBlob, 'voicenote.webm');

            try {
                const res = await fetch('/api/voice-notes', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (res.ok) {
                    showStatus('Saved & Transcribed successfully!', 'success');
                } else {
                    const errText = await res.text();
                    showStatus('Upload failed: ' + (errText || 'Server error'), 'error');
                }
            } catch (err) {
                showStatus('Network error during upload.', 'error');
            }
        }

        function showStatus(msg, type) {
            statusAlert.className = `status-msg status-${type}`;
            statusAlert.textContent = msg;
            statusAlert.style.display = 'block';
        }
    </script>
</body>
</html>
