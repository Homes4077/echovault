<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoVault — Upload Photos</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --primary-blue: #0084ff;
            --primary-hover: #0066cc;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-border: #ef4444;
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-border: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.6rem;
            color: #ffffff;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--primary-blue);
        }

        .upload-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: #070a10;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary-blue);
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            background-color: #070a10;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            background-color: #334155;
            cursor: not-allowed;
        }

        .alert {
            display: none;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 16px;
        }

        .alert-error {
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: #fca5a5;
        }

        .alert-success {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            color: #6ee7b7;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>EchoVault Photos</h1>
            <nav>
                <a href="vault.html">Vault</a>
                <a href="write-letter.html">Write Letter</a>
                <a href="photos.html" class="active">Upload Photos</a>
                <a href="memorial.html">Memorial Wall</a>
            </nav>
        </header>

        <main>
            <div class="upload-card">
                <form id="uploadForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input type="text" id="title" name="title" placeholder="e.g. Summer Vacation" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category">
                                <option value="GENERAL">GENERAL</option>
                                <option value="PERSONAL">PERSONAL</option>
                                <option value="MOTIVATIONAL">MOTIVATIONAL</option>
                                <option value="FAMILY">FAMILY</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="caption">Caption</label>
                        <textarea id="caption" name="caption" rows="2" placeholder="Write a short description or memory..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="files">Select Image File(s)</label>
                        <input type="file" id="files" name="files" accept="image/*" multiple required>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-submit">Upload Photos</button>
                </form>

                <div id="alertBox" class="alert"></div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            checkAuthStatus();
            document.getElementById("uploadForm").addEventListener("submit", handlePhotoUpload);
        });

        function getToken() {
            return localStorage.getItem("jwtToken") || localStorage.getItem("token");
        }

        function checkAuthStatus() {
            const token = getToken();
            if (!token) {
                showAlert("Please log in to upload photographs.", "error");
                document.getElementById("submitBtn").disabled = true;
            }
        }

        async function handlePhotoUpload(event) {
            event.preventDefault();

            const token = getToken();
            if (!token) {
                showAlert("Access Denied (401): Please log in first.", "error");
                window.location.href = "/login.html";
                return;
            }

            const fileInput = document.getElementById("files");
            if (!fileInput.files || fileInput.files.length === 0) {
                showAlert("Please select at least one image file.", "error");
                return;
            }

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.innerText = "Uploading...";

            const formData = new FormData();
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append("files", fileInput.files[i]);
            }
            formData.append("title", document.getElementById("title").value);
            formData.append("category", document.getElementById("category").value);
            formData.append("caption", document.getElementById("caption").value);

            try {
                const response = await fetch("/api/photos/upload", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token
                        // Note: Do NOT set "Content-Type" manually when sending FormData
                    },
                    body: formData
                });

                if (response.status === 401 || response.status === 403) {
                    showAlert("Access Denied (401): Session expired or insufficient user privileges.", "error");
                    setTimeout(() => {
                        window.location.href = "/login.html";
                    }, 2000);
                    return;
                }

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || "Failed to upload photograph.");
                }

                showAlert("Photo uploaded successfully!", "success");
                document.getElementById("uploadForm").reset();

                setTimeout(() => {
                    window.location.href = "/vault.html";
                }, 1500);

            } catch (error) {
                console.error("Upload error:", error);
                showAlert(error.message || "An error occurred while uploading.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Upload Photos";
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById("alertBox");
            alertBox.innerText = message;
            alertBox.className = "alert " + (type === "success" ? "alert-success" : "alert-error");
            alertBox.style.display = "block";
        }
    </script>
</body>
</html>
