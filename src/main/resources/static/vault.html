<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoVault — Main Vault</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --primary-blue: #0084ff;
            --primary-hover: #0066cc;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --badge-bg: #1e293b;
            --status-locked: #3b82f6;
            --status-unlocked: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.6rem;
            color: #ffffff;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--primary-blue);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background-color: var(--primary-blue);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #334155;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        /* Photo Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .photo-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .photo-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-blue);
        }

        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background-color: #070a10;
        }

        .photo-card-body {
            padding: 15px;
        }

        .photo-category {
            display: inline-block;
            background: var(--badge-bg);
            color: var(--primary-blue);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .photo-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .photo-caption {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Letters Grid */
        .letters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .letter-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s;
        }

        .letter-card:hover {
            border-color: var(--primary-blue);
        }

        .letter-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .letter-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            color: #ffffff;
            white-space: nowrap;
        }

        .badge-locked {
            background-color: var(--status-locked);
        }

        .badge-unlocked {
            background-color: var(--status-unlocked);
        }

        .letter-recipient {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .letter-body {
            font-size: 0.9rem;
            color: var(--text-main);
            background: #0d1322;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            white-space: pre-wrap;
            max-height: 140px;
            overflow-y: auto;
            line-height: 1.4;
        }

        .letter-locked-msg {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            background: #0d1322;
            padding: 12px;
            border-radius: 6px;
            border: 1px dashed var(--border-color);
        }

        .empty-state, .error-state {
            text-align: center;
            padding: 50px 20px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            overflow: hidden;
        }

        .modal-content img {
            width: 100%;
            max-height: 75vh;
            object-fit: contain;
            display: block;
        }

        .modal-caption {
            background: var(--card-bg);
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>EchoVault</h1>
            <nav>
                <a href="vault.html" class="active">Vault</a>
                <a href="write-letter.html">Write Letter</a>
                <a href="photos.html">Upload Photos</a>
                <a href="memorial.html">Memorial Wall</a>
            </nav>
        </header>

        <main>
            <!-- Photos Section -->
            <div class="section-header">
                <h2 class="section-title">Photographic Memories</h2>
                <div class="action-buttons">
                    <a href="photos.html" class="btn-action">+ Add Photo</a>
                </div>
            </div>

            <div id="vaultPhotoGrid" class="photo-grid">
                <div class="empty-state">Loading vault photographs...</div>
            </div>

            <!-- Letters Section -->
            <div class="section-header" style="margin-top: 50px;">
                <h2 class="section-title">Time-Locked Letters</h2>
                <div class="action-buttons">
                    <a href="write-letter.html" class="btn-action btn-secondary">✉️ Write Letter</a>
                </div>
            </div>

            <div id="vaultLetterGrid" class="letters-grid">
                <div class="empty-state">Loading time-locked letters...</div>
            </div>
        </main>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="modalImg" src="" alt="Full Preview">
            <div class="modal-caption">
                <h3 id="modalTitle"></h3>
                <p id="modalDesc"></p>
            </div>
        </div>
    </div>

    <script>
        async function fetchVaultPhotos() {
            const grid = document.getElementById('vaultPhotoGrid');
            const token = localStorage.getItem('jwtToken') || localStorage.getItem('token');

            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            const headers = { 'Authorization': 'Bearer ' + token };

            try {
                const response = await fetch('/api/photos', { headers: headers });
                
                if (response.status === 401 || response.status === 403) {
                    window.location.href = '/login.html';
                    return;
                }

                if (!response.ok) throw new Error('Failed to load photos');

                const photos = await response.json();

                if (!photos || photos.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <p>No photographs found in your personal vault.</p>
                            <br>
                            <a href="photos.html" class="btn-action">Upload Your First Photo</a>
                        </div>`;
                    return;
                }

                grid.innerHTML = photos.map(photo => `
                    <div class="photo-card" 
                         data-url="${photo.imageUrl}" 
                         data-title="${escapeAttr(photo.title)}" 
                         data-caption="${escapeAttr(photo.caption)}" 
                         onclick="openModalFromElement(this)">
                        <img src="${photo.imageUrl}" alt="${escapeAttr(photo.title || 'Vault Photo')}" loading="lazy" />
                        <div class="photo-card-body">
                            <span class="photo-category">${escapeHtml(photo.category || 'GENERAL')}</span>
                            <div class="photo-title">${escapeHtml(photo.title || 'Untitled')}</div>
                            <div class="photo-caption">${escapeHtml(photo.caption || 'No description provided.')}</div>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Error loading photos:', err);
                grid.innerHTML = `
                    <div class="error-state" style="grid-column: 1 / -1;">
                        <p style="color: #ef4444;">Unable to load photos.</p>
                    </div>`;
            }
        }

        async function fetchVaultLetters() {
            const grid = document.getElementById('vaultLetterGrid');
            const token = localStorage.getItem('jwtToken') || localStorage.getItem('token');

            if (!token) return;

            const headers = { 'Authorization': 'Bearer ' + token };

            try {
                const response = await fetch('/api/letters', { headers: headers });

                if (!response.ok) throw new Error('Failed to load letters');

                const letters = await response.json();

                if (!letters || letters.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <p>No time-locked letters found in your vault.</p>
                            <br>
                            <a href="write-letter.html" class="btn-action">Schedule Your First Letter</a>
                        </div>`;
                    return;
                }

                const now = new Date();

                grid.innerHTML = letters.map(letter => {
                    const scheduledTime = letter.scheduledDeliveryAt ? new Date(letter.scheduledDeliveryAt) : null;
                    const isDelivered = letter.delivered || (scheduledTime && scheduledTime <= now);
                    const formattedDate = scheduledTime ? scheduledTime.toLocaleString() : 'Immediate';
                    const contentText = letter.bodyContent || letter.content || '';

                    return `
                        <div class="letter-card">
                            <div>
                                <div class="letter-card-header">
                                    <div class="letter-title">${escapeHtml(letter.subject || letter.title || 'Untitled Letter')}</div>
                                    <span class="status-badge ${isDelivered ? 'badge-unlocked' : 'badge-locked'}">
                                        ${isDelivered ? '🔓 Unlocked' : '🔒 Locked'}
                                    </span>
                                </div>
                                <div class="letter-recipient">
                                    To: <strong>${escapeHtml(letter.recipientName || 'Recipient')}</strong> 
                                    (${escapeHtml(letter.recipientEmail || 'No email')})
                                </div>
                                <div style="margin-bottom: 12px;">
                                    <span class="photo-category">${escapeHtml(letter.tag || 'GENERAL')}</span>
                                </div>
                                ${isDelivered 
                                    ? `<div class="letter-body">${escapeHtml(contentText)}</div>` 
                                    : `<div class="letter-locked-msg">🔒 Message content is locked until release on <strong>${formattedDate}</strong>.</div>`
                                }
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Error loading letters:', err);
                grid.innerHTML = `
                    <div class="error-state" style="grid-column: 1 / -1;">
                        <p style="color: #ef4444;">Unable to load letters. Please try again later.</p>
                    </div>`;
            }
        }

        function openModalFromElement(el) {
            document.getElementById('modalImg').src = el.getAttribute('data-url');
            document.getElementById('modalTitle').innerText = el.getAttribute('data-title') || 'Untitled';
            document.getElementById('modalDesc').innerText = el.getAttribute('data-caption') || '';
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function escapeAttr(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchVaultPhotos();
            fetchVaultLetters();
        });
    </script>
</body>
</html>
