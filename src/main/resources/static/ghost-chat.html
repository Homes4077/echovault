<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoVault - Ghost Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; padding: 2rem 1rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .brand { color: #0ea5e9; font-weight: 700; text-decoration: none; font-size: 1.1rem; }
        .chat-card { background: #131c31; border: 1px solid #1e293b; border-radius: 12px; padding: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        .chat-header { margin-bottom: 1.5rem; }
        .chat-header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.35rem; color: #f8fafc; }
        .chat-header p { color: #94a3b8; font-size: 0.875rem; }
        .chat-box { background: #0b1120; border: 1px solid #1e293b; border-radius: 8px; height: 420px; padding: 1.25rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1rem; }
        .msg { max-width: 82%; padding: 0.85rem 1.1rem; border-radius: 8px; font-size: 0.925rem; line-height: 1.5; }
        .msg-assistant { background: #1e293b; align-self: flex-start; color: #f8fafc; border-bottom-left-radius: 2px; }
        .msg-user { background: #0284c7; align-self: flex-end; color: #ffffff; border-bottom-right-radius: 2px; }
        .msg-error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; align-self: flex-start; width: 100%; max-width: 100%; }
        .input-row { display: flex; gap: 0.75rem; }
        input { flex: 1; background: #0b1120; border: 1px solid #1e293b; border-radius: 6px; padding: 0.85rem 1rem; color: #fff; outline: none; font-size: 0.95rem; }
        input:focus { border-color: #0ea5e9; }
        button { background: #0ea5e9; color: #fff; border: none; padding: 0.85rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0284c7; }
        button:disabled { background: #334155; cursor: not-allowed; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/dashboard.html" class="brand">← Dashboard</a>
            <span style="color: #64748b; font-size: 0.9rem;">Ghost Assistant Engine</span>
        </div>

        <div class="chat-card">
            <div class="chat-header">
                <h1>Consult Ghost Assistant Engine</h1>
                <p>Interrogates vault entries via Gemini AI with strict ground-truth constraints.</p>
            </div>

            <div class="chat-box" id="chatBox">
                <div class="msg msg-assistant">
                    Hello. I am the EchoVault Assistant representing this vault's owner. Ask me anything about their preserved memories or advice.
                </div>
            </div>

            <form id="chatForm" class="input-row">
                <input type="text" id="userInput" placeholder="Ask a question..." required autocomplete="off">
                <button type="submit" id="sendBtn">Ask Ghost</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            alert("Session expired. Please log in again.");
            window.location.href = '/login.html';
        }

        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = userInput.value.trim();
            if (!prompt) return;

            appendMessage(prompt, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            try {
                const res = await fetch('/api/ghost/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || `HTTP ${res.status}`);
                }

                appendMessage(data.response || data.message || "No response generated.", 'assistant');
            } catch (err) {
                appendMessage(`Error: ${err.message || 'Error connecting to Ghost Assistant Engine. Verify backend service and Gemini API key.'}`, 'error');
            } finally {
                sendBtn.disabled = false;
            }
        });

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg msg-${sender}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
