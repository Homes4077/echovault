<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoVault - Login</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-header h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .brand-header p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #38bdf8;
        }

        .question-box {
            background-color: #0f172a;
            border: 1px dashed #0284c7;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            color: #38bdf8;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }

        .btn-submit:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .error-message {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        .footer-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .footer-links a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-header">
            <h1>EchoVault</h1>
            <p>Legacy & Memory Preservation</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="user@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="viewMode">Log In As</label>
                <select id="viewMode" name="viewMode">
                    <option value="USER" selected>👤 Account Owner (Personal Vault)</option>
                    <option value="FAMILY">🔒 Family Member (Read-Only & Ghost AI)</option>
                    <option value="ADMIN">⚡ System Administrator</option>
                </select>
            </div>

            <!-- Owner & Admin Password Input -->
            <div class="form-group" id="passwordGroup">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
            </div>

            <!-- Family Security Question Input -->
            <div class="form-group" id="securityGroup" style="display: none;">
                <label>Emergency Security Question</label>
                <div id="questionDisplay" class="question-box">Enter account email above to load security question...</div>
                
                <label for="securityAnswer">Security Answer</label>
                <input type="text" id="securityAnswer" name="securityAnswer" placeholder="Enter security answer">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
            <div id="errorMessage" class="error-message"></div>
        </form>

        <div class="footer-links">
            <p>Don't have an account? <a href="/register.html">Create one here</a></p>
            <p style="font-size: 0.75rem; color: #64748b; margin-top: 0.25rem;">Authorized access only</p>
        </div>
    </div>

    <script>
        const viewModeSelect = document.getElementById('viewMode');
        const passwordGroup = document.getElementById('passwordGroup');
        const securityGroup = document.getElementById('securityGroup');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const securityAnswerInput = document.getElementById('securityAnswer');
        const questionDisplay = document.getElementById('questionDisplay');

        function toggleModeFields() {
            const mode = viewModeSelect.value;
            if (mode === 'FAMILY') {
                passwordGroup.style.display = 'none';
                passwordInput.removeAttribute('required');
                securityGroup.style.display = 'block';
                securityAnswerInput.setAttribute('required', 'true');
                fetchSecurityQuestion();
            } else {
                securityGroup.style.display = 'none';
                securityAnswerInput.removeAttribute('required');
                passwordGroup.style.display = 'block';
                passwordInput.setAttribute('required', 'true');
            }
        }

        async function fetchSecurityQuestion() {
            const email = emailInput.value.trim();
            if (viewModeSelect.value !== 'FAMILY') return;

            if (!email) {
                questionDisplay.textContent = 'Enter account email above to load security question...';
                return;
            }

            questionDisplay.textContent = 'Retrieving security question...';

            try {
                const response = await fetch(`/api/auth/security-question?email=${encodeURIComponent(email)}`);
                const data = await response.json();

                if (response.ok) {
                    questionDisplay.textContent = data.question;
                } else {
                    questionDisplay.textContent = data.error || 'No security question set for this account.';
                }
            } catch (err) {
                questionDisplay.textContent = 'Error connecting to server.';
            }
        }

        viewModeSelect.addEventListener('change', toggleModeFields);
        emailInput.addEventListener('blur', fetchSecurityQuestion);

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const viewMode = viewModeSelect.value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';

            const payload = { email, viewMode };
            if (viewMode === 'FAMILY') {
                payload.securityAnswer = securityAnswerInput.value.trim();
            } else {
                payload.password = passwordInput.value;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                let data = {};
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                }

                if (response.ok) {
                    const token = data.token || data.jwtToken || data.accessToken;
                    const userId = data.id || data.userId;

                    if (token) localStorage.setItem('jwtToken', token);
                    if (data.role) localStorage.setItem('userRole', data.role);
                    if (userId) localStorage.setItem('userId', userId);

                    window.location.href = data.redirectUrl || '/memorial.html';
                } else {
                    errorDiv.textContent = data.error || data.message || 'Authentication failed.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Network failure:', error);
                errorDiv.textContent = 'Connection error. Please ensure the server is running.';
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
