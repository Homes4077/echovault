# H2 File Database with PostgreSQL Dialect Emulation
spring.datasource.url=jdbc:h2:file:./data/echovaultdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Execute schema.sql manually if ddl-auto is set to 'none'
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Secure H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
