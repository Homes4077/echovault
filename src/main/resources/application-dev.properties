# EchoVault Local Development Configuration (H2 File Database with PostgreSQL Dialect Emulation)
spring.datasource.url=jdbc:h2:file:./data/echovaultdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate Configurations
# Note: Remove spring.jpa.properties.hibernate.dialect to let Spring Boot auto-detect dialect and eliminate HHH90000025 warnings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Datasource Initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Secure H2 Console Access
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Gemini AI Engine Properties
gemini.api.key=${GEMINI_API_KEY:YOUR_GCP_API_KEY}