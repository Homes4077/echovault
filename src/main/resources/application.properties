spring.application.name=echovault
server.port=8080
spring.profiles.active=dev

# File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Security & JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Third-Party Integrations (Dual-mapped with fallbacks)
assemblyai.api.key=${ASSEMBLYAI_API_KEY:dummy_assemblyai_key}
assemblyai.api-key=${ASSEMBLYAI_API_KEY:dummy_assemblyai_key}

openai.api.key=${OPENAI_API_KEY:dummy_openai_key}
openai.api-key=${OPENAI_API_KEY:dummy_openai_key}

sendgrid.api-key=${SENDGRID_API_KEY:SG.dummy_key}
spring.sendgrid.api-key=${SENDGRID_API_KEY:SG.dummy_key}

spring.ai.gcp.api-key=${GCP_API_KEY:dummy_gcp_key}
gcp.api.key=${GCP_API_KEY:dummy_gcp_key}

twilio.account-sid=${TWILIO_ACCOUNT_SID:dummy_account_sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:dummy_auth_token}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+15005550006}
twilio.from-number=${TWILIO_FROM_NUMBER:+15005550006}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo_cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:1234567890}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:sample_secret}

# Logging & Serialization
logging.level.root=INFO
logging.level.com.echovault=DEBUG
spring.jackson.serialization.write-dates-as-timestamps=false
