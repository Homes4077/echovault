server.port=8080
spring.application.name=echovault

# MySQL Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/echovault_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Setup
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Thresholds
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 1. Google Gemini Flash API Key
gemini.api.key=${GEMINI_API_KEY}

# 2. AssemblyAI API Key
assemblyai.api.key=${ASSEMBLYAI_API_KEY}

# 3. Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# 4. Twilio SMS Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}

# 5. SendGrid Email Configuration
spring.sendgrid.api-key=${SENDGRID_API_KEY}
echovault.email.sender=${SENDGRID_SENDER_EMAIL:noreply@echovault.com}

# 6. Unsplash API Key (Memorial Backgrounds)
unsplash.access-key=${UNSPLASH_ACCESS_KEY}

# 7. Google Calendar API
google.calendar.api-key=${GOOGLE_CALENDAR_API_KEY}
