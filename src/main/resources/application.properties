# ==========================================
# SPRING APPLICATION CONFIGURATION
# ==========================================
spring.application.name=echovault
server.port=8080

# ==========================================
# DATABASE & H2 CONSOLE CONFIGURATION
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:echovaultdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==========================================
# SECURITY & JWT CONFIGURATION
# ==========================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# GCP / GEMINI AI CONFIGURATION
# ==========================================
spring.ai.gcp.api-key=${GCP_API_KEY:YOUR_GCP_API_KEY}
gcp.api.key=${GCP_API_KEY:YOUR_GCP_API_KEY}

# ==========================================
# OPENAI CONFIGURATION
# ==========================================
openai.api-key=${OPENAI_API_KEY:dummy_openai_key}
openai.api.key=${OPENAI_API_KEY:dummy_openai_key}

# ==========================================
# SENDGRID EMAIL CONFIGURATION
# ==========================================
sendgrid.api-key=${SENDGRID_API_KEY:SG.dummy_key}
spring.sendgrid.api-key=${SENDGRID_API_KEY:SG.dummy_key}

# ==========================================
# TWILIO SMS CONFIGURATION
# ==========================================
twilio.account-sid=${TWILIO_ACCOUNT_SID:AC_dummy_account_sid}
twilio.account_sid=${TWILIO_ACCOUNT_SID:AC_dummy_account_sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:dummy_auth_token}
twilio.auth_token=${TWILIO_AUTH_TOKEN:dummy_auth_token}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+15005550006}
twilio.phone_number=${TWILIO_PHONE_NUMBER:+15005550006}
twilio.from-number=${TWILIO_FROM_NUMBER:+15005550006}
twilio.from_number=${TWILIO_FROM_NUMBER:+15005550006}

# ==========================================
# CLOUDINARY MEDIA CONFIGURATION
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo_cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:1234567890}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:sample_secret}

# ==========================================
# ASSEMBLYAI SPEECH-TO-TEXT CONFIGURATION
# ==========================================
assemblyai.api.key=${ASSEMBLYAI_API_KEY:sample_assemblyai_key}
assemblyai.api-key=${ASSEMBLYAI_API_KEY:sample_assemblyai_key}
