# Activate the Local Profile
spring.profiles.active=local

# Application Settings
spring.application.name=echovault
server.port=8080

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:echovault;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate / JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Multipart File Upload Limits (for Audio Voice Notes)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Fallback Credentials (Overridden by active profile)
cloudinary.cloud-name=placeholder
cloudinary.api-key=placeholder
cloudinary.api-secret=placeholder

sendgrid.api-key=placeholder

twilio.account-sid=placeholder
twilio.auth-token=placeholder
twilio.phone-number=placeholder
