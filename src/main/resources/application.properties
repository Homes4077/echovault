# Activate the Local Profile
spring.profiles.active=local

# Application Settings
spring.application.name=echovault
server.port=${PORT:8080}

# Database Configuration (H2 File-Based / Environment Override for Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/echovault;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate / JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Multipart File Upload Limits (for Audio Voice Notes)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Fallback Credentials (Overridden by Render Environment Variables)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:placeholder}
cloudinary.api-key=${CLOUDINARY_API_KEY:placeholder}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:placeholder}

sendgrid.api-key=${SENDGRID_API_KEY:placeholder}

twilio.account-sid=${TWILIO_ACCOUNT_SID:placeholder}
twilio.auth-token=${TWILIO_AUTH_TOKEN:placeholder}
twilio.phone-number=${TWILIO_PHONE_NUMBER:placeholder}
