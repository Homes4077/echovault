# Spring Application Configuration
spring.application.name=echovault

# Server Port
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:echovaultdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# GCP / Gemini AI Configuration
spring.ai.gcp.api-key=${GCP_API_KEY:YOUR_GCP_API_KEY}

# SendGrid Email Configuration
spring.sendgrid.api-key=${SENDGRID_API_KEY:YOUR_SENDGRID_API_KEY}
